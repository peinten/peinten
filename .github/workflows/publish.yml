# Publishes packages/peinten to npm when a tag like v0.2.0 is pushed.
# Authenticates through npm trusted publishing, so no npm token is stored in the repository.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: read
      # Lets npm exchange the workflow's OIDC token for publish rights and sign the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No dependency cache: a poisoned cache must not reach a release.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile

      - name: Check the tag against the version and the changelog
        id: release
        run: |
          version=$(node -p "require('./packages/peinten/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the package version $version"
            exit 1
          fi
          if ! grep -Eq "^## ${version//./\\.} - [0-9]{4}-[0-9]{2}-[0-9]{2}$" packages/peinten/CHANGELOG.md; then
            echo "::error::packages/peinten/CHANGELOG.md has no dated '## $version - YYYY-MM-DD' heading"
            exit 1
          fi
          # Prereleases such as 0.2.0-beta.1 must not become `latest`.
          if [[ "$version" == *-* ]]; then echo "dist-tag=next" >> "$GITHUB_OUTPUT"; else echo "dist-tag=latest" >> "$GITHUB_OUTPUT"; fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:unused
      # GPU tests need a WebGPU adapter, which hosted runners lack; run them locally before tagging.
      - run: pnpm --filter peinten test:unit

      # pnpm pack applies publishConfig (exports pointing at dist) and runs the build; npm publishes the tarball
      # because it handles trusted publishing and provenance.
      - name: Pack
        run: pnpm --filter peinten pack --pack-destination "$RUNNER_TEMP/package"
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/package/peinten-*.tgz --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ steps.release.outputs.dist-tag }}
